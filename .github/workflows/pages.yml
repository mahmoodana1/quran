# Publishes the app to GitHub Pages on every push to main: the repository as it is, its
# scripts and stylesheet minified on the way (about half the size to fetch and read on a slow
# phone; the names the files share are kept, the sources in the repository untouched);
# .nojekyll keeps it from being run through Jekyll
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Minify
        run: npx --yes esbuild@0.25.10 *.js app.css --minify --charset=utf8 --target=es2022 --outdir=. --allow-overwrite --log-level=warning
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 2400000 # GitHub's Pages queue can be slow; 40 min, not the 10 by default
