<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="القرآن">
<meta name="theme-color" content="#faf6f3">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>القرآن الكريم</title>
</head>
<body>
<div id="probe"></div>

<main id="viewport">
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</main>

<div id="loading">جارٍ التحميل…</div>

<!-- actions for the selected aya -->
<div id="ayaBar" class="bar acts" hidden>
  <div class="acts-head">
    <div class="acts-title"><span class="dot"></span><b id="ayaBarTitle"></b></div>
    <button data-act="close" class="x-btn" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"/></svg></button>
  </div>
  <div class="acts-row">
    <button data-act="play"><i><svg viewBox="0 0 24 24"><path d="M8.5 5.5v13l10.5-6.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></i><span>استماع</span></button>
    <button data-act="tafsir"><i><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></i><span>تفسير</span></button>
    <button data-act="copy"><i><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 8.5V6a2.5 2.5 0 00-2.5-2.5H7A2.5 2.5 0 004.5 6v7A2.5 2.5 0 007 15.5h1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></i><span>نسخ</span></button>
    <button data-act="bookmark"><i><svg viewBox="0 0 24 24"><path d="M6.5 4.5h11v15.5l-5.5-3.8-5.5 3.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></i><span>علامة</span></button>
  </div>
</div>

<!-- audio player -->
<div id="player" class="bar mini" hidden>
  <div class="pl-track"><i id="plProg"></i></div>
  <div class="pl-info"><b id="plTitle"></b><small>الشيخ ياسر الدوسري</small></div>
  <div class="pl-ctrl">
    <button id="plPrev" class="pl-btn" aria-label="الآية السابقة"><svg viewBox="0 0 24 24"><path d="M17 6v12M13.5 12L5 18V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
    <button id="plToggle" class="pl-main" aria-label="تشغيل/إيقاف"><svg viewBox="0 0 24 24" class="ic-pause"><rect x="7" y="5.5" width="3.6" height="13" rx="1.2"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1.2"/></svg><svg viewBox="0 0 24 24" class="ic-play"><path d="M8.5 5.5v13l10.5-6.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="plNext" class="pl-btn" aria-label="الآية التالية"><svg viewBox="0 0 24 24"><path d="M17 6v12M13.5 12L5 18V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" transform="matrix(-1 0 0 1 24 0)"/></svg></button>
    <button id="plStop" class="x-btn" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"/></svg></button>
  </div>
</div>

<div id="toast" hidden></div>

<!-- tafsir As-Sa'di for one aya -->
<section id="tafsir" hidden>
  <div class="tf-grip"></div>
  <div class="tf-head">
    <button id="tfClose" class="tf-icon" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"/></svg></button>
    <div class="tf-title"><b id="tfTitle"></b><small>تفسير السعدي</small></div>
    <div class="tf-nav">
      <button id="tfPrev" class="tf-icon" aria-label="الآية السابقة"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="tfNext" class="tf-icon" aria-label="الآية التالية"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div id="tfBody" class="tf-body"></div>
</section>

<!-- index / search sheet -->
<section id="sheet" hidden>
  <div class="sheet-head">
    <button id="sheetClose" class="txt-btn">تم</button>
    <div class="sheet-title"><h1 id="sheetTitle">الفهرس</h1><small id="sheetSub"></small></div>
    <button id="libBtn" class="lib-btn" aria-label="ختماتي"><svg viewBox="0 0 24 24"><path d="M5 4.5h3.5v15H5zM10.5 4.5H14v15h-3.5zM15.6 5.6l3.3-.9 3.4 14.2-3.3.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="ابحث عن سورة أو آية… (مثال: البقرة ٢٥٥)" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="suras" class="on">السور</button>
    <button data-tab="juz">الأجزاء</button>
    <button data-tab="marks">العلامات</button>
    <button data-tab="riwaya">الإعدادات</button>
  </nav>
  <div id="sheetBody"></div>
</section>

<!-- khatma library -->
<section id="library" hidden>
  <div class="sheet-head">
    <button id="libClose" class="txt-btn">‹ رجوع</button>
  </div>
  <h1 class="lib-title">ختماتي</h1>
  <p class="lib-note">لكل ختمة مصحفها وموضع قراءتها وعلاماتها الخاصة.</p>
  <div id="shelf" class="shelf"></div>
</section>

<!-- create / edit a khatma -->
<section id="khEdit" class="modal" hidden>
  <form id="khForm" class="card" autocomplete="off">
    <h2 id="khTitle">ختمة جديدة</h2>
    <div id="khPreview" class="preview"></div>
    <div class="fields">
      <label class="field"><span>الاسم</span><input name="name" maxlength="40"></label>
      <label class="field"><span>الرواية</span><select name="riwaya"></select></label>
    </div>
    <div class="fields"><div class="field"><span>الغلاف</span><div id="swatches" class="swatches"></div></div></div>
    <div class="actions">
      <button type="submit" id="khSave" class="primary">ابدأ الختمة</button>
      <button type="button" id="khCancel">إلغاء</button>
    </div>
    <div class="actions minor">
      <button type="button" id="khRestart">البدء من الصفحة الأولى</button>
      <button type="button" id="khDelete" class="danger">حذف الختمة</button>
    </div>
  </form>
</section>

<!-- khatma finished -->
<section id="done" class="modal" hidden>
  <div class="card done">
    <div id="doneCover" class="preview"></div>
    <h2>ما شاء الله، تمّت الختمة</h2>
    <p id="doneText"></p>
    <p class="dua">اللهم ارحمني بالقرآن واجعله لي إمامًا ونورًا وهدىً ورحمة</p>
    <div class="actions">
      <button id="doneAgain" class="primary">ابدأ الختمة من جديد</button>
      <button id="doneLater">لاحقًا</button>
    </div>
  </div>
</section>

<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
